
[build-system]
build-backend = 'mesonpy'
requires = [
    # >=0.21.0 for limited API (abi3) wheel support, including the handling
    # of free-threaded interpreters.
    "meson-python>=0.21.0",
    "Cython>=3.1.0",
    "setuptools_scm[toml]>=6.2",
    "numpy>=2.0.0rc1",
]

[project]
name = 'geoana'
dynamic = ["version"]
description = 'Analytic expressions for geophysical responses'
readme = 'README.rst'
requires-python = '>=3.12'
authors = [
  {name = 'SimPEG developers', email = 'lindseyheagy@gmail.com'},
]
keywords = [
    'geophysics', 'electromagnetics', 'gravity', 'magnetics'
]

# Note: Python and NumPy upper version bounds should be set correctly in
# release branches, see:
#     https://scipy.github.io/devdocs/dev/core-dev/index.html#version-ranges-for-numpy-and-other-dependencies
dependencies = [
    "numpy>=1.22.4",
    "scipy>=1.12",
    "libdlf",
]
classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Education',
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python',
    'Programming Language :: Cython',
    'Topic :: Scientific/Engineering',
    'Topic :: Scientific/Engineering :: Mathematics',
    'Topic :: Scientific/Engineering :: Physics',
    'Operating System :: Microsoft :: Windows',
    'Operating System :: POSIX',
    'Operating System :: Unix',
    'Operating System :: MacOS',
    'Natural Language :: English',
]

[project.license]
file = 'LICENSE'

[project.optional-dependencies]
plot = ["matplotlib"]
extras = ["utm"]
jittable = ["numba"]
all = ["geoana[plot,extras,jittable]"]
doc = [
    "sphinx==8.1.3",
    "pydata-sphinx-theme==0.16.1",
    "sphinx-gallery==0.19.0",
    "numpydoc==1.9.0",
    "jupyter",
    "graphviz",
    "pillow",
    "geoana[all]",
]
test = [
    "pytest",
    "pytest-cov",
    "sympy",
    "discretize",
    "requests",
]
build = [
    "meson-python>=0.21.0",
    "meson",
    "ninja",
    "numpy>=2.0.0rc1",
    "cython>=3.1.0",
    "setuptools_scm",
]

[project.urls]
Homepage = 'https://simpeg.xyz'
Documentation = 'https://geoana.simpeg.xyz'
Repository = 'https://github.com/simpeg/geoana.git'

[tool.setuptools_scm]

[tool.meson-python]
# Build one abi3 wheel per platform (targeting the 3.12 limited API, see
# geoana/kernels/_extensions/meson.build) instead of one per Python version.
# Free-threaded builds opt out with `-Dpython.allow_limited_api=false` for
# now: 3.14t has no stable ABI at all, and Cython can't yet generate code
# for the 3.15t one (abi3t). Revisit once Cython ships abi3t support.
# This has no effect on the default pure-python build (no extensions).
limited-api = true

[tool.cibuildwheel]
# cp312-* is the abi3 wheel covering every GIL-enabled CPython >= 3.12. The
# free-threaded builds are ordinary per-version wheels (see the override
# below).
build = ["cp312-*", "cp314t-*", "cp315t-*"]
# skip specialty linux processors (still does arm builds though) and 32-bit
# windows.
skip = "*_ppc64le *_i686 *_s390x *-win32"
build-verbosity = 3
# build the compiled extensions, and use the visual studio compilers on
# windows (--vsenv is a no-op elsewhere).
config-settings = { setup-args = ["-Dwith_extensions=true", "--vsenv"] }

# test importing geoana to make sure externals are loadable.
test-command = 'python -c "import geoana; geoana.show_config()"'

[[tool.cibuildwheel.overrides]]
# Free-threaded builds use the regular (non-limited) API, see
# [tool.meson-python]. The base setup-args are repeated here because an
# override replaces the whole key rather than appending to it.
select = ["cp314t-*", "cp315t-*"]
config-settings = { setup-args = [
    "-Dwith_extensions=true",
    "--vsenv",
    "-Dpython.allow_limited_api=false",
] }

[tool.pytest.ini_options]
# avoids geoana/ (a sibling of tests/) shadowing an installed, compiled
# geoana when pytest is invoked from the repo root -- matters for
# non-editable installs, where the default "prepend" import mode can resolve
# the uncompiled source tree ahead of the real (site-packages) package.
addopts = "--import-mode=importlib"
filterwarnings = [
    'ignore:divide by zero encountered in divide:RuntimeWarning',
    'ignore:invalid value encountered in divide:RuntimeWarning',
    'ignore:invalid value encountered in multiply:RuntimeWarning',
    'ignore:invalid value encountered in sqrt:RuntimeWarning',
    'ignore::numpy.exceptions.ComplexWarning'
]



[tool.coverage.run]
branch = true
# geoana is measured as an importable package (wherever it's installed,
# e.g. site-packages for CI's non-editable install) rather than as the
# geoana/ source directory, which the tests don't actually execute.
source_pkgs = ["geoana"]
# plugins = [
#     "Cython.Coverage",
# ]

[tool.coverage.paths]
# map an installed geoana back onto the repo's geoana/ directory, so
# reports (and codecov) point at the source files.
geoana = ["geoana/", "*/site-packages/geoana/"]

[tool.coverage.report]
ignore_errors = false
show_missing = true
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
    "AbstractMethodError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
]

