name: Build Distribution artifacts

on: [push, pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-15-intel is an Intel runner, macos-14 is Apple silicon
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15-intel, macos-14]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  # Don't upload this one to pypi, otherwise it will be preferred over every compiled one
  # We can host it here on github though for those that need it (re: jupyter-light).
  pure_python:
    name: Create pure-python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v10
      - name: Build pure python wheel and install
        run: |
          uv build --wheel --python 3.12
          uv venv --python 3.12 /tmp/pure-venv
          uv pip install --python /tmp/pure-venv ./dist/geoana*.whl
          (cd / && /tmp/pure-venv/bin/python -c "import geoana; geoana.show_config()")
      - uses: actions/upload-artifact@v4
        with:
          path: ./dist/geoana*.whl


  distribute:
    name: Distribute documentation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v10

    - name: Install graphviz
      run: sudo apt-get update && sudo apt-get install -y graphviz

    - name: Install Our Package
      run: |
        uv sync --python 3.13 --no-editable --extra doc --extra all --extra build           --config-settings=setup-args="-Dwith_extensions=true"

    - name: Build documentation
      run: uv run --no-sync make -C docs html

    - name: GitHub Pages
      uses: crazy-max/ghaction-github-pages@v2.5.0
      with:
        build_dir: docs/_build/html
        fqdn: geoana.simpeg.xyz
        jekyll: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  release:
    name: Create Release
    needs: [
      build_wheels,
      build_sdist,
      pure_python
    ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        shell: bash -l {0}
    steps:
    - uses: actions/download-artifact@v4
      with:
        # unpacks all CIBW artifacts into dist/
        pattern: cibw-*
        path: dist
        merge-multiple: true

    - name: Release to github
      uses: softprops/action-gh-release@v1
      with:
        files: dist/*
        generate_release_notes: true
        prerelease: false

    - name: Remove anywheel before pypi upload
      run: rm -f dist/geoana*none-any.whl

    - name: Upload wheels to pypi
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: true
        packages-dir: ./dist/